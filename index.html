<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side-by-Side Video Comparison</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" aria-hidden="true">
  <defs>
    <clipPath id="iphone-17-pro-screen-clip" clipPathUnits="objectBoundingBox">
      <path transform="scale(0.0024875622 0.0011441648)" d="M100.8 0C65.5166 0 47.8748 -0.0004 34.3984 6.8662C22.5442 12.9062 12.9062 22.5442 6.8662 34.3984C-0.0004 47.8749 0 65.5166 0 100.8V773.2C0 808.483 -0.0004 826.125 6.8662 839.602C12.9062 851.456 22.5442 861.094 34.3984 867.134C47.8749 874 65.5166 874 100.8 874H301.2C336.483 874 354.125 874 367.602 867.134C379.456 861.094 389.094 851.456 395.134 839.602C402 826.125 402 808.483 402 773.2V100.8C402 65.5166 402 47.8748 395.134 34.3984C389.094 22.5442 379.456 12.9062 367.602 6.8662C354.125 -0.0004 336.483 0 301.2 0H100.8Z"/>
    </clipPath>
  </defs>
</svg>

<header class="topbar">
  <div class="app-logo">
    <span class="logo-icon">□■</span>
    <span class="logo-text">SIDE-BY-SIDE</span>
  </div>
  <div class="toolbar" role="toolbar" aria-label="Canvas controls">
    <div class="toolbar-group">
      <select id="layout-frame-select" title="Frame style" aria-label="Frame style">
        <option value="none" selected>No Frame</option>
        <option value="generic-android">Generic Android</option>
        <option value="iphone-17-pro">iPhone 17 Pro</option>
        <option value="app">App</option>
      </select>
      <button id="btn-bg" type="button" title="Set background image" aria-pressed="false">Choose image</button>
      <input type="file" id="layout-bg-input" accept="image/*" class="visually-hidden-input">
    </div>
    <span class="toolbar-divider" aria-hidden="true"></span>
    <div class="toolbar-group">
      <button id="btn-title" type="button" aria-pressed="false">Title</button>
      <button id="btn-subtitle" type="button" aria-pressed="false">Subtitle</button>
      <select id="label-size-select" title="Title and subtitle size" aria-label="Title and subtitle size">
        <option value="s" selected>Small</option>
        <option value="m">Medium</option>
        <option value="l">Large</option>
        <option value="xl">Extra large</option>
      </select>
      <select id="label-position-select" title="Title and subtitle position" aria-label="Title and subtitle position">
        <option value="top" selected>Top</option>
        <option value="bottom">Bottom</option>
        <option value="outer-sides">Outer sides</option>
      </select>
    </div>
  </div>
</header>

<main class="stage">
  <div class="canvas" id="canvas">
    <div class="canvas-vpad-handle canvas-vpad-top"><div class="drag-grip"></div></div>
    <div class="canvas-middle">
    <div class="canvas-hpad-handle canvas-hpad-left"><div class="drag-grip"></div></div>
    <div class="panel-slot active" id="panel-left" tabindex="0">
      <div class="panel-content">
        <div class="panel-label hidden">
          <input type="text" class="label-title-input hidden" placeholder="Before">
          <input type="text" class="label-subtitle-input hidden" placeholder="Add subtitle...">
        </div>
        <div class="video-sizer">
          <div class="drop-zone">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="6" y="10" width="36" height="28" rx="3"/>
              <polygon points="20,17 20,31 32,24"/>
            </svg>
            <div class="drop-label">Drop video</div>
            <div class="drop-formats">MP4, WebM, MOV</div>
            <input type="file" accept="video/*">
          </div>
          <div class="video-player-frame">
            <div class="app-titlebar">
              <div class="app-titlebar-dots">
                <span class="dot dot-close"></span>
                <span class="dot dot-minimize"></span>
                <span class="dot dot-maximize"></span>
              </div>
              <span class="app-titlebar-title"></span>
            </div>
            <div class="video-frame"><canvas></canvas></div>
            <div class="timeline-bar empty" id="timeline-left">
              <div class="timeline-lane">
                <div class="lane-range"></div>
                <div class="range-handle range-in"><span class="range-tooltip"></span></div>
                <div class="range-handle range-out"><span class="range-tooltip"></span></div>
                <div class="lane-playhead"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="panel-divider" id="panel-divider">
      <div class="divider-handle"><div class="drag-grip"></div></div>
    </div>
    <div class="panel-slot" id="panel-right" tabindex="0">
      <div class="panel-content">
        <div class="panel-label hidden">
          <input type="text" class="label-title-input hidden" placeholder="After">
          <input type="text" class="label-subtitle-input hidden" placeholder="Add subtitle...">
        </div>
        <div class="video-sizer">
          <div class="drop-zone">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="6" y="10" width="36" height="28" rx="3"/>
              <polygon points="20,17 20,31 32,24"/>
            </svg>
            <div class="drop-label">Drop video</div>
            <div class="drop-formats">MP4, WebM, MOV</div>
            <input type="file" accept="video/*">
          </div>
          <div class="video-player-frame">
            <div class="app-titlebar">
              <div class="app-titlebar-dots">
                <span class="dot dot-close"></span>
                <span class="dot dot-minimize"></span>
                <span class="dot dot-maximize"></span>
              </div>
              <span class="app-titlebar-title"></span>
            </div>
            <div class="video-frame"><canvas></canvas></div>
            <div class="timeline-bar empty" id="timeline-right">
              <div class="timeline-lane">
                <div class="lane-range"></div>
                <div class="range-handle range-in"><span class="range-tooltip"></span></div>
                <div class="range-handle range-out"><span class="range-tooltip"></span></div>
                <div class="lane-playhead"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="canvas-hpad-handle canvas-hpad-right"><div class="drag-grip"></div></div>
    </div>
    <div class="canvas-vpad-handle canvas-vpad-bottom"><div class="drag-grip"></div></div>
  </div>
</main>

<footer class="bottombar">
  <div class="bottom-controls">
    <button id="btn-play"><span class="button-label">Play</span><kbd>Space</kbd></button>
    <select id="speed" aria-label="Playback speed" data-dropdown-placement="top">
      <option value="0.25">0.25x Speed</option>
      <option value="0.5">0.5x Speed</option>
      <option value="1" selected>1x Speed</option>
      <option value="1.5">1.5x Speed</option>
      <option value="2">2x Speed</option>
    </select>
    <span class="rail-divider" aria-hidden="true"></span>
    <button id="btn-export" class="filled" title="Export trimmed clip from active panel [E]">Export <kbd>E</kbd></button>
  </div>
</footer>


<div class="export-overlay hidden" id="export-overlay">
  <div class="export-dialog">
    <div class="export-header">
      <span class="export-title">Exporting</span>
    </div>
    <div class="export-body">
      <div class="progress-track"><div class="progress-fill"></div></div>
      <div class="export-frames-row">
        <span class="export-frames-current">0</span>
        <span class="export-frames-total">0</span>
      </div>
      <div class="export-setting-row">
        <span class="export-setting-label">Frame Rate</span>
        <select class="export-format-select" id="export-fps" aria-label="Frame rate">
          <option value="24">24 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="60">60 fps</option>
        </select>
      </div>
      <div class="export-controls-row">
        <select class="export-format-select" id="export-format" aria-label="Export format">
          <option value="webm" selected>WebM</option>
          <option value="mp4">MP4</option>
          <option value="gif">GIF</option>
        </select>
        <button class="export-action-btn filled" type="button">Export</button>
      </div>
    </div>
  </div>
</div>

<script src="exporters/exporter-registry.js"></script>
<script src="panel.js"></script>
<script src="app.js"></script>
</body>
</html>
